<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChudsForever</title>
  <script>
    try { const t = localStorage.getItem("cf-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap">
  <link rel="icon" type="image/png" href="favicon.png?v=79615db9a3">
  <link rel="icon" href="favicon.ico?v=212200aaed" sizes="16x16 32x32 48x48">
  <link rel="stylesheet" href="style.css?v=039deec167">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img class="brand-cat" src="cat-logo.png?v=15cb003bbb" alt="" width="48" height="48">
        <div class="brand-text">
          <span class="brand-name">ChudsForever</span>
          <span class="brand-sub">Your AH scans</span>
        </div>
      </div>

      <div class="scan" id="scan"></div>

      <input id="search" class="search" type="search" placeholder="Search…" aria-label="Search recipes" autocomplete="off">

      <nav class="group profs" id="profs" aria-label="Profession">
        <span class="label">Profession</span>
      </nav>

      <div class="group pricing">
        <span class="label">Pricing</span>
        <select id="basis" class="select" aria-label="Price basis">
          <option value="market">Market (cheapest 25%)</option>
          <option value="min">Minimum buyout</option>
        </select>
        <label class="row-between">AH cut
          <span class="cut"><input id="cut" class="cut-input" type="text" inputmode="decimal" value="5">%</span>
        </label>
        <div class="row-between">
          <label class="check" title="The deposit is lost if the item doesn't sell, and refunded if it does"><input id="deposit" type="checkbox">Include AH deposit</label>
          <select id="duration" class="select select-sm" aria-label="Auction length" hidden>
            <option value="12">12h</option>
            <option value="24">24h</option>
            <option value="48">48h</option>
          </select>
        </div>
        <label class="check"><input id="craftMats" type="checkbox" checked>Craft reagents when cheaper</label>
        <label class="check" title="The Bartering legacy talent: 10% off what vendors charge"><input id="barter" type="checkbox">Bartering (10% off vendors)</label>
        <label class="row-between" title="Reputation discount with the vendors you buy from">Rep discount
          <select id="repDiscount" class="select select-sm">
            <option value="0">None</option>
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
          </select>
        </label>
        <span class="hint">Vendor prices are from Wowhead. Discounts are saved in this browser.</span>
      </div>

      <div class="group pricing">
        <span class="label">Filters</span>
        <label class="check"><input id="onlyProfit" type="checkbox">Profitable only</label>
        <label class="check"><input id="showUnpriced" type="checkbox">Show unpriced recipes</label>
        <label class="check" title="Items with only 1 or 2 listed: one seller sets the price, so it may not hold"><input id="hideFew" type="checkbox">Hide few listed</label>
        <label class="check" title="Hides recipes that come from drops, vendors or quests. Recipes with an unknown source stay listed."><input id="trainerOnly" type="checkbox">Trainer recipes only</label>
      </div>

      <button id="theme" class="theme-btn" type="button"></button>
    </aside>

    <main class="main">
      <section class="top">
        <h2 class="top-title">Most profitable right now</h2>
        <div class="cards" id="cards"></div>
      </section>

      <div class="view-tabs" id="viewTabs" role="tablist" hidden>
        <button type="button" role="tab" data-view="recipes">Recipes</button>
        <button type="button" role="tab" data-view="level">Cheapest leveling path</button>
        <button type="button" role="tab" data-view="cooldowns">Cooldowns</button>
      </div>

      <section class="level" id="level" hidden></section>
      <section class="level" id="cooldowns" hidden></section>

      <div class="table" id="table">
        <div class="thead" id="thead">
          <button data-sort="name">Recipe</button>
          <button data-sort="qty" class="num">On AH</button>
          <button data-sort="sold" class="num" title="Estimated units sold per day, from comparing scans">Sold/day</button>
          <button data-sort="sell" class="num">Sells for</button>
          <button data-sort="cost" class="num">Cost</button>
          <button data-sort="margin" class="num">Margin</button>
          <button data-sort="profit" class="num">Profit</button>
        </div>
        <div id="rows"></div>
        <div id="more" class="more"></div>
      </div>
    </main>
  </div>

  <script src="app.js?v=67837f0212"></script>
</body>
</html>
